name: Generator parity

# Guards the dual generator (ADR-0001): filter_generation/generate.py (Python, the
# reference/oracle) must stay BYTE-FOR-BYTE identical to
# webapp/frontend/src/utils/filterGenerator.ts (TypeScript, the engine that ships to
# browsers). A divergence once shipped silently — a SetBackgroundColor mismatch — because
# this test wasn't run after a commit. Running it on every PR makes that unmissable.

on:
  push:            # every branch — immediate feedback while you work
  pull_request:    # and on PRs (the pre-merge gate)

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # create_demo_bundle.py (run inside the parity test) imports the FastAPI backend.
      - name: Install backend deps
        run: pip install -r webapp/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend deps
        working-directory: webapp/frontend
        run: npm ci

      - name: Typecheck
        working-directory: webapp/frontend
        run: npx tsc -b

      # Bakes demo data, VERIFIES the bake is fresh (a stale bundle silently turned this
      # into "fresh Python vs frozen data" and still reported PASS), then runs generate.py
      # + filterGenerator.ts on identical inputs and asserts byte-for-byte agreement.
      - name: Generator parity (generate.py == filterGenerator.ts)
        working-directory: webapp/frontend
        run: node test_generator_parity.mjs

      # Guards the OTHER half: the editor preview must emit what the filter exports.
      # Generator parity never covered this, because the preview is not one of the two
      # generators — it was a third opinion, and it disagreed.
      - name: Resolver equivalence (editor preview == exported filter)
        working-directory: webapp/frontend
        run: node test_resolver_equivalence.mjs

      # Guards the DATA, which neither test above looks at: both generators agree happily
      # on curation that emits nothing. Fails only on ERROR — curation that silently drops
      # items (a tier key the category does not define) or breaks the game's grammar.
      # Warnings are advisory and do not fail the build.
      #
      # Name checks need the GGPK tables under data/source/, which are gitignored, so on
      # CI the validator skips them and says so. That is deliberate: it degrades loudly
      # rather than falling back to a stale catalogue and reporting valid bases as typos.
      - name: Curation validation (no silently-dropped items)
        run: python parsing_tool/validate_curation.py
