name: Filter checks

# Three guards, deliberately different in kind (ADR-0007 — there is ONE generation
# engine now, so "do the two generators agree?" is no longer a question that exists):
#
#   fixtures     does the generator emit what we decided it should, on a synthetic
#                tree with committed golden output? Catches engine behaviour changes.
#   equivalence  do the editor preview and the exported filter agree? Catches the
#                preview drifting from what actually ships.
#   validation   does the curation emit at all? Catches items filed under a tier key
#                the category does not define — which builds cleanly and drops them.

on:
  push:            # every branch — immediate feedback while you work
  pull_request:    # and on PRs (the pre-merge gate)

jobs:
  parity:   # job id kept so existing branch-protection required-checks keep resolving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Python no longer generates the filter (ADR-0007) but still does offline data
      # prep: create_demo_bundle.py imports the FastAPI backend, and the validator runs
      # against the curation tree.
      - name: Install backend deps
        run: pip install -r webapp/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend deps
        working-directory: webapp/frontend
        run: npm ci

      - name: Typecheck
        working-directory: webapp/frontend
        run: npx tsc -b

      # The generator's regression net. Synthetic tree, committed golden output — so a
      # tier tweak never moves it, and anything that DOES move it is an engine change
      # with a readable diff. This is what replaced dual-generator parity.
      - name: Generator fixtures (engine emits the decided output)
        working-directory: webapp/frontend
        run: node test_generator_fixtures.mjs

      # The editor preview must emit what the filter exports. Bakes the demo bundle and
      # verifies the bake is fresh first — a stale bundle once turned a whole session's
      # PASSes into comparisons against frozen data.
      - name: Resolver equivalence (editor preview == exported filter)
        working-directory: webapp/frontend
        run: node test_resolver_equivalence.mjs

      # The CLI must actually run. Cheap end-to-end check that esbuild resolves, the data
      # tree loads and a filter comes out — none of which the in-process tests exercise.
      - name: Generator CLI smoke test
        run: node filter_generation/generate.mjs --mode ruthless --strictness soft --out /tmp/ci.filter

      # Guards the DATA, which neither test above looks at: both generators agree happily
      # on curation that emits nothing. Fails only on ERROR — curation that silently drops
      # items (a tier key the category does not define) or breaks the game's grammar.
      # Warnings are advisory and do not fail the build.
      #
      # Name checks need the GGPK tables under data/source/, which are gitignored, so on
      # CI the validator skips them and says so. That is deliberate: it degrades loudly
      # rather than falling back to a stale catalogue and reporting valid bases as typos.
      - name: Curation validation (no silently-dropped items)
        run: python parsing_tool/validate_curation.py
