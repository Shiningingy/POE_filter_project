# Nav structure: chapter separator -> group -> optional subgroup -> leaf.
# Compiled to category_structure.json by parsing_tool/generate_category_json.py.
#
# ⚠️ Still diff the compiler's output before replacing the .json - it is not proven
# to reproduce the committed file byte-for-byte. For a small change (a nav add or
# remove, ~10 lines) it remains easiest to edit BOTH files by hand.
#
# ★ A LEAF CARRIES NO THEME KEY. It used to: `target: X` / `_default_target: X`
# compiled to `target_category`, and the theme board used that as its read AND write
# key. Being hand-typed in two files it drifted from the value the generator actually
# reads - the tier definition's `_meta.theme_category` - on 13 of 92 leaves, so the
# board showed looks the filter does not emit and banked edits where nothing reads
# them (editing Contracts restyled every Map). Both keys are gone; the tier definition
# at `tier_path` is the single source. See filterStyle.resolveThemeKey.
#
# Do not reintroduce a theme key here. To give a category its own look, set
# `_meta.theme_category` in its tier_definition file.

